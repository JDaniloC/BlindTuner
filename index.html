<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BlindTuner — Oficina de Luthier 2.5D</title>
    <style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;margin:0;padding:0}body{color:#e6edf3;background-color:#080a0e;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}#app-container{background:#0f141c;border:2px solid #2e1d13;border-radius:16px;flex-direction:column;width:100vw;max-width:560px;height:100vh;max-height:980px;display:flex;position:relative;overflow:hidden;box-shadow:0 16px 50px #000000d9}#canvas-wrapper{touch-action:none;flex:1;width:100%;height:100%;position:relative}canvas{width:100%;height:100%;display:block}#ui-header{pointer-events:none;z-index:10;flex-direction:column;gap:8px;display:flex;position:absolute;top:14px;left:14px;right:14px}.hud-bar{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);pointer-events:auto;background:#18100ce6;border:1.5px solid #543926;border-radius:12px;justify-content:space-between;align-items:center;padding:10px 16px;display:flex;box-shadow:0 4px 20px #00000080}.hud-title{color:#f5d77f;letter-spacing:.5px;align-items:center;gap:8px;font-family:Georgia,serif;font-size:15px;font-weight:700;display:flex}.hud-badge{color:#fff;background:#3e2723;border:1px solid #8d6e63;border-radius:6px;padding:4px 10px;font-family:monospace;font-size:12px;font-weight:700}#note-track{align-items:center;gap:6px;display:flex}.note-bead{color:#bbb;background:#271912;border:1.5px solid #543926;border-radius:50%;justify-content:center;align-items:center;width:22px;height:22px;font-size:10px;font-weight:700;transition:transform .2s,background .2s,border-color .2s;display:flex}.note-bead.active{color:#fff;transform:scale(1.25);box-shadow:0 0 12px}.note-bead.done{border-color:#ffd54f}#audio-init-modal{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:100;text-align:center;background:#0c0806f0;flex-direction:column;justify-content:center;align-items:center;padding:32px;display:flex;position:absolute;inset:0}.modal-box{background:#1c130d;border:2px solid #5d3f28;border-radius:16px;flex-direction:column;align-items:center;max-width:380px;padding:28px 24px;display:flex;box-shadow:0 20px 60px #000000e6}.btn-luthier{color:#fff8e1;cursor:pointer;background:linear-gradient(#9e472a 0%,#6e2c17 100%);border:1.5px solid #d4af37;border-radius:10px;margin-top:20px;padding:14px 32px;font-family:Georgia,serif;font-size:16px;font-weight:700;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 20px #9e472a73}.btn-luthier:hover{transform:scale(1.04);box-shadow:0 8px 25px #d4af3780}.btn-luthier:active{transform:scale(.97)}.hud-mode-btn{color:#e0d5ce;cursor:pointer;background:#271912;border:1.5px solid #5d3f28;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;transition:all .15s}.hud-mode-btn:hover{color:#fff;border-color:#ffd54f;transform:translateY(-1px)}.hud-mode-btn.active{color:#fff8e1;background:#5d321d;border-color:#ffd54f;box-shadow:0 0 8px #ffd54f66}.hud-select{color:#f5d77f;cursor:pointer;background:#271912;border:1.5px solid #5d3f28;border-radius:8px;outline:none;padding:5px 8px;font-size:11px;font-weight:700;transition:border-color .15s}.hud-select:hover,.hud-select:focus{border-color:#ffd54f}.hud-select option{color:#fff8e1;background:#1c130d}#status-announcer{clip:rect(0, 0, 0, 0);white-space:nowrap;border-width:0;width:1px;height:1px;margin:-1px;padding:0;position:absolute;overflow:hidden}</style>
    <script type="module" crossorigin src="./assets/index-DbXSORcZ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/CanvasPool-D3ODu9e7.js">
    <link rel="modulepreload" crossorigin href="./assets/canvasUtils-DsvvwVU-.js">
    <link rel="modulepreload" crossorigin href="./assets/RenderTargetSystem-CaB52_J4.js">
    <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-DxOwDA4R.js">
    <link rel="modulepreload" crossorigin href="./assets/getTexelRangeRects-Br5ybXw-.js">
  </head>
  <body>
    <div id="app-container">
      <div id="canvas-wrapper"></div>
      
      <!-- HUD Superior Artesanal -->
      <div id="ui-header">
        <div class="hud-bar">
          <div class="hud-title">
            <span style="font-size: 18px;">🎻</span>
            <span>BlindTuner</span>
          </div>
          <button id="btn-style-toggle" class="hud-badge" style="cursor:pointer; background:#2e1d13; border: 1.5px solid #ffd54f; font-family: inherit; font-size: 11px; transition: transform 0.15s, border-color 0.2s;">🎨 Estilo: Pixel Art 16-bit</button>
          <div class="hud-badge" id="hud-phase">Aguardando Início</div>
        </div>
        <!-- Barra 2: Presets de Cômodos, Campanha & Acessibilidade -->
        <div class="hud-bar" style="justify-content: space-between; gap: 8px; flex-wrap: wrap;">
          <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <select id="select-campaign-level" class="hud-select" aria-label="Nível da Campanha e Suzuki">
              <optgroup label="História: O Despertar">
                <option value="ch1_quarto_radio" selected>🛏️ Cap. 1: Quarto do Luthier</option>
                <option value="ch1_banheiro_drip">🛁 Cap. 1: O Som das Gotas</option>
                <option value="ch1_sala_pendulo">🛋️ Cap. 1: Sala de Estar e Música</option>
              </optgroup>
              <optgroup label="Caderno Suzuki">
                <option value="arcade_suzuki_1">⭐ Suzuki 1: Brilha Estrelinha</option>
                <option value="arcade_suzuki_2">⭐ Suzuki 1: Canção do Vento</option>
                <option value="arcade_suzuki_3">⭐ Suzuki 2: Coro dos Caçadores</option>
              </optgroup>
            </select>
            <select id="select-cue-level" class="hud-select" aria-label="Nível de Pista Visual">
              <option value="0" selected>🎯 Pista 0: Tudo</option>
              <option value="1">🎯 Pista 1: Freq+Cor</option>
              <option value="2">🎯 Pista 2: Só Cor</option>
              <option value="3">🎯 Pista 3: Só Som</option>
            </select>
            <select id="select-color-scheme" class="hud-select" aria-label="Esquema de Cores WCAG">
              <option value="pedagogico" selected>🌈 Pedagógico</option>
              <option value="alto_contraste">👁️ Alto Contraste</option>
              <option value="classico">🎨 Clássico</option>
            </select>
            <select id="select-vision-impairment" class="hud-select" aria-label="Simulador de Baixa Visão">
              <option value="none" selected>👁️ Visão: Padrão</option>
              <option value="cataract">👁️ Catarata</option>
              <option value="macular_degeneration">👁️ Deg. Macular</option>
              <option value="glaucoma_tunnel">👁️ Glaucoma (Túnel)</option>
              <option value="diabetic_retinopathy">👁️ Retinopatia</option>
            </select>
          </div>
          <button id="btn-toggle-control-cues" class="hud-mode-btn active" style="font-size: 10.5px; padding: 5px 8px;" title="Ativar ou desativar cores nos instrumentos">🎛️ Pistas Controles: ON</button>
        </div>

        <!-- Barra 3: Placa Didática da Nota Alvo (NotePanel) -->
        <div id="note-panel-container" class="hud-bar" style="padding: 8px 14px;"></div>

        <!-- Barra 4: Modos de Entrada e Sequência Musical -->
        <div class="hud-bar" style="justify-content: space-between; gap: 8px;">
          <div style="display: flex; gap: 6px; align-items: center;">
            <button id="btn-mode-scroll" class="hud-mode-btn active" title="Modo 0: Braço de Violoncelo Fretless">🎻 Scroll</button>
            <button id="btn-mode-joystick" class="hud-mode-btn" title="Modo 1: Joystick Direcional de 8 Fatias">🕹️ Joystick</button>
            <button id="btn-mode-piano" class="hud-mode-btn" title="Modo 2: Piano Cromático Virtual">🎹 Piano</button>
          </div>
          <div id="note-track"></div>
        </div>
      </div>

      <!-- Modal de Início -->
      <div id="audio-init-modal">
        <div class="modal-box">
          <h2 style="font-family: Georgia, serif; color: #f5d77f; margin-bottom: 12px; font-size: 24px;">Oficina de Luthier</h2>
          <p style="color: #d7ccc8; font-size: 14px; line-height: 1.6; margin-bottom: 6px;">
            Acompanhe o Sr. Arthur. Ouça a melodia das notas musicais e afine cada uma no braço do violoncelo para avançar pelo quarto.
          </p>
          <button id="btn-start" class="btn-luthier">Entrar na Oficina</button>
        </div>
      </div>
    </div>
    <div id="status-announcer" aria-live="polite"></div>
  </body>
</html>
